[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]

[tool.setuptools.package-data]
# The ontology registry is shipped data, resolved by version at compile time.
benchy = ["ontologies/*.yaml"]

[tool.setuptools.packages.find]
where = ["."]
include = ["benchy", "benchy.*"]

[project]
name = "benchy"
version = "1.0.0"
description = "A semantic language and execution engine for benchmarking AI programs"
readme = "README.md"
requires-python = ">=3.12"
# PyYAML and nothing else. A provider integration's requirements belong to that
# integration, not to benchy (paper A.11) - the shipped OpenAI-compatible adapter
# uses urllib precisely so installing benchy installs no vendor package.
dependencies = [
    "pyyaml>=6.0",
]

[project.scripts]
benchy = "benchy.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "coverage>=7.0.0",
    "ruff>=0.6.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: touches the network or a real provider; excluded from the default suite",
]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["F", "E9"]
