# The same benchmark as examples/invoices and examples/together, evaluated on Claude
# via Amazon Bedrock. Only `ai-system` differs between the three — which is the point
# of B = (P, S, D) being separate from the system that takes it.
#
#   export AWS_BEARER_TOKEN_BEDROCK=...   # a Bedrock API key, not IAM keys
#   export AWS_REGION=us-east-1           # us-east-1 has the most Claude models
#   benchy run examples/bedrock-claude/benchmark.yaml
#
# The model MUST be a cross-region inference profile id — `us.anthropic.…` or
# `global.anthropic.…`. Every Anthropic model on Bedrock is INFERENCE_PROFILE-only, so a
# bare `anthropic.claude-…` is refused with "on-demand throughput isn't supported".
#
# Claude does not serve Bedrock's OpenAI-compatible endpoint; llm-client routes it to
# the Converse API and turns the output schema into a forced tool call.
version: "1.0"
ontology_version: "1.0"

benchmark:
  task: extract
  domain: finance
  language: es

program:
  input:
    text: string
  output:
    invoice_number: string
    date: date
    supplier:
      name: string
      tax_id: string
    subtotal: float
    total: float

scoring:
  weights:
    invoice_number: 1
    date: 1
    supplier:
      name: 1
      tax_id: 0
    subtotal: 1
    total: 5
  aggregator: weighted_mean

data:
  path: ./exam.jsonl

ai-system:
  type: model
  provider: bedrock
  model: us.anthropic.claude-haiku-4-5-20251001-v1:0
  parameters:
    temperature: 0
    max_tokens: 2048
