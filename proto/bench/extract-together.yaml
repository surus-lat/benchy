# bench/extract-together.yaml — the cloud-first exam-taker, end to end.
# Same 4 pillars; the system compiles to an openai-compatible chat call.
# Run:  TOGETHER_API_KEY=... python3 nb.py bench/extract-together.yaml

task:
  in: text
  out: fields

scoring:
  match: fields
  weights:
    total: 5
    vendor: 1
    date: 1

system:
  kind: http
  url: https://api.together.xyz/v1
  model: meta-llama/Llama-3.3-70B-Instruct-Turbo
  api_key_env: TOGETHER_API_KEY
  system: >
    Extract invoice fields. Reply ONLY with JSON:
    {"total": str, "vendor": str, "date": str}
    total is digits only, no $ sign. vendor lowercase.
    date as written, no weekday.
  parse: json
  timeout: 60
  retries: 2

cases:
  - input: "invoice from acme dated 2026-01-01: total $100"
    expected: {total: "100", vendor: "acme", date: "2026-01-01"}
  - input: "receipt from globex dated 2026-02-15: total $42.50 — urgent"
    expected: {total: "42.50", vendor: "globex", date: "2026-02-15"}