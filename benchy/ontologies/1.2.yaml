# Shared SURUS task-oriented AI ontology — /<task>/<domain>/<language>/
#
# Registry version 1.2: version 1.1 plus the `audit` task, for exams that score a
# categorical VERDICT over a record checked against a policy: several parallel
# slots (a decision, a reason code, a downgrade target), each a closed enum or a
# boolean. Every 1.1 task, domain and language is carried over unchanged, so
# moving a benchmark from 1.1 to 1.2 changes nothing else.
#
# Identifiers and descriptions only: the structural rules that decide whether a
# program is a valid instance of a task are Benchy code (see benchy/ontology.py),
# deliberately not a constraint DSL (paper Appendix B).
#
# `transcribe` remains absent; see the 1.0 registry and paper Appendix E.
version: "1.2"

tasks:
  extract:
    description: Extract named information from an input.

  classify:
    description: Assign one declared categorical label.

  translate:
    description: Transform text from a source language to a target language.

  answer:
    description: Answer a question in natural language.

  audit:
    description: Audit a record against a policy and emit a verdict of parallel categorical fields.

domains:
  general: {}
  finance: {}
  healthcare: {}
  legal: {}
  retail: {}
  # Academic fields (added for university benchmarks; additive, so existing
  # 1.0 benchmarks keep their exact meaning).
  anthropology: {}
  archaeology: {}
  sociology: {}
  history: {}
  linguistics: {}
  literature: {}
  philosophy: {}
  political_science: {}
  economics: {}
  psychology: {}
  education: {}
  geography: {}
  communication: {}
  arts: {}
  law: {}
  biology: {}
  chemistry: {}
  physics: {}
  mathematics: {}
  computer_science: {}
  earth_sciences: {}
  environmental_science: {}
  agriculture: {}
  engineering: {}
  medicine: {}
  public_health: {}

languages:
  es: {}
  pt: {}
  en: {}
